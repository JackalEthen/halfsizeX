name: Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    # Secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
    #          ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Prepare release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -n "$ANDROID_KEYSTORE_BASE64" ]]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore.jks"
            echo "HALFSIZE_KEYSTORE=$RUNNER_TEMP/keystore.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; release APK will use the debug key."
          fi

      - name: Build split APKs
        env:
          HALFSIZE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          HALFSIZE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          HALFSIZE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release --split-per-abi

      - name: Name artifacts
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^version: *([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' pubspec.yaml | head -n1)"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "dist/halfsizeX-${version}-android-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "dist/halfsizeX-${version}-android-armeabi-v7a.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: app/dist/*.apk
          if-no-files-found: error

  windows:
    name: Windows MSI and portable ZIP
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install WiX
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Download FFmpeg
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'ffmpeg.zip'
          $dir = Join-Path $env:RUNNER_TEMP 'ffmpeg'
          Invoke-WebRequest -Uri 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl-shared.zip' -OutFile $zip
          Expand-Archive -LiteralPath $zip -DestinationPath $dir -Force
          $root = (Get-ChildItem -LiteralPath $dir -Directory | Select-Object -First 1).FullName
          "FFMPEG_DIR=$(Join-Path $root 'bin')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build installer and portable ZIP
        shell: pwsh
        run: .\tool\package_windows.ps1 -FfmpegDir $env:FFMPEG_DIR

      - uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: |
            app/dist/*.zip
            app/dist/*.msi
          if-no-files-found: error

  linux:
    name: Linux bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-13-dev rpm

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Download FFmpeg
        shell: bash
        run: |
          set -euo pipefail
          curl -L -o /tmp/ffmpeg.tar.xz 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz'
          mkdir -p /tmp/ffmpeg
          tar -xJf /tmp/ffmpeg.tar.xz -C /tmp/ffmpeg --strip-components=1
          echo "FFMPEG_DIR=/tmp/ffmpeg/bin" >> "$GITHUB_ENV"

      - name: Download appimagetool
        shell: bash
        run: |
          set -euo pipefail
          curl -L -o /tmp/appimagetool 'https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage'
          chmod +x /tmp/appimagetool
          mkdir -p /tmp/appimagetool-extract
          (cd /tmp/appimagetool-extract && /tmp/appimagetool --appimage-extract >/dev/null)
          echo "APPIMAGETOOL=/tmp/appimagetool-extract/squashfs-root/AppRun" >> "$GITHUB_ENV"

      - name: Build Linux bundle and packages
        shell: bash
        run: |
          flutter build linux --release
          bash tool/package_linux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux-dist
          path: |
            app/dist/*.AppImage
            app/dist/*.deb
            app/dist/*.rpm
            app/dist/*portable.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows, linux]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
